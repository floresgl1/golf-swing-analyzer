<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Golf Swing Analyzer — Phase Arc app icon
       Render to 1024×1024 opaque PNG as icon.png (iOS + Android full icon)
       Render foreground only (transparent bg) as icon_foreground.png (Android adaptive) -->
  <defs>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.55" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#132E1F"/>
      <stop offset="100%" stop-color="#0B1D13"/>
    </radialGradient>
  </defs>

  <!-- Background (opaque — required by iOS) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Arc glow (subtle bloom behind the main stroke) -->
  <path d="M 110,415 C 70,220 130,30 275,40 C 390,48 440,200 400,375"
        stroke="url(#arc)" stroke-width="56" fill="none" stroke-linecap="round" opacity="0.07"/>

  <!-- Swing arc -->
  <path d="M 110,415 C 70,220 130,30 275,40 C 390,48 440,200 400,375"
        stroke="url(#arc)" stroke-width="28" fill="none" stroke-linecap="round"/>

  <!-- Phase dots: address, top, impact -->
  <circle cx="113" cy="410" r="19" fill="#ffffff" opacity="0.85"/>
  <circle cx="275" cy="40"  r="19" fill="#ffffff" opacity="0.85"/>
  <circle cx="400" cy="370" r="24" fill="#06B6D4"/>

  <!-- Impact emphasis ring -->
  <circle cx="400" cy="370" r="42" stroke="#06B6D4" stroke-width="3.5" fill="none" opacity="0.25"/>
</svg>
