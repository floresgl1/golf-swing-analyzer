name: iOS Release (TestFlight)

# Separate from ios-build.yml on purpose. That workflow is the compile gate:
# fast, unconditional, runs on every push and PR, needs no secrets. This one
# signs and uploads, is slow, consumes a TestFlight build number, and must
# never fire automatically — so it is manual-only rather than a conditional
# job bolted onto the gate.
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Build and sign, but do not upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: flutter_app

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      # Same regenerate-then-patch shape as the compile gate: ios/ is
      # gitignored, so it does not exist in the checkout.
      - name: Generate iOS platform files
        run: flutter create --platforms=ios --project-name golf_swing_analyzer .

      # A dedicated keychain rather than the login keychain: it is created
      # unlocked with a known password, deleted at the end, and cannot leave
      # the runner's default keychain in a modified state if the job dies.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # -A would grant every tool access; -T limits it to codesign.
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security

          # Without this, codesign blocks on an interactive "allow access?"
          # prompt that nothing can answer on a headless runner.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Prepend rather than replace: the runner's default keychains still
          # hold the Apple intermediate certificates codesign needs to build a
          # chain. Replacing the search list breaks signing with a confusing
          # "unable to build chain to self-signed root" error.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/cert.p12"

          echo "Identities available to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # Xcode locates profiles by their embedded UUID, not by filename.
          UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -o - -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"

          NAME="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract Name raw -o - -)"
          echo "Installed profile '$NAME' as $UUID.mobileprovision"

          # The profile's own Name must match the secret the patcher writes
          # into PROVISIONING_PROFILE_SPECIFIER, or xcodebuild fails late with
          # "no profile matching". Comparing here fails early and says why.
          if [ "$NAME" != "${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}" ]; then
            echo "::error::Profile Name is '$NAME' but IOS_PROVISIONING_PROFILE_SPECIFIER is '${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}'. They must match exactly."
            exit 1
          fi

      # Same script as the compile gate. Signing turns on only because these
      # two variables are set; the gate runs it with them unset and gets an
      # unsigned tree. One source of truth for every generated-tree value.
      - name: Configure generated iOS project
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: python3 tool/configure_ios.py

      - name: Install dependencies
        run: flutter pub get

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          # Generated rather than committed: it carries the team id and the
          # profile name, and it must agree with the xcconfig the patcher
          # wrote. Both read the same two secrets so they cannot drift.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.floresgl1.golfSwingAnalyzer</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      # TestFlight permanently rejects a build number it has already seen, so
      # it comes from the run number rather than from a committed bump.
      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        if: ${{ !inputs.skip_upload }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool discovers the key by name in this directory; there is no
          # flag to pass the key material inline.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_PRIVATE_KEY" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          IPA="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa produced under build/ios/ipa"
            exit 1
          fi
          echo "Uploading $IPA"

          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: flutter_app/build/ios/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 7

      # always(): a failed run must not leave the certificate in a keychain on
      # a runner image, and must not leave the search list pointing at one.
      - name: Clean up keychain and key material
        if: always()
        run: |
          security list-keychains -d user -s $(security list-keychains -d user | grep -v signing.keychain | tr -d '"') || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" || true
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/cert.p12" || true
