name: iOS Release (TestFlight)

# Separate from ios-build.yml on purpose. That workflow is the compile gate:
# fast, unconditional, runs on every push and PR, needs no secrets. This one
# signs and uploads, is slow, consumes a TestFlight build number, and must
# never fire automatically — so it is manual-only rather than a conditional
# job bolted onto the gate.
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Build and sign, but do not upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: ios-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: flutter_app

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      # Same regenerate-then-patch shape as the compile gate: ios/ is
      # gitignored, so it does not exist in the checkout.
      - name: Generate iOS platform files
        run: flutter create --platforms=ios --project-name golf_swing_analyzer .

      # A dedicated keychain rather than the login keychain: it is created
      # unlocked with a known password, deleted at the end, and cannot leave
      # the runner's default keychain in a modified state if the job dies.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # -A would grant every tool access; -T limits it to codesign.
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security

          # Without this, codesign blocks on an interactive "allow access?"
          # prompt that nothing can answer on a headless runner.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Prepend rather than replace: the runner's default keychains still
          # hold the Apple intermediate certificates codesign needs to build a
          # chain. Replacing the search list breaks signing with a confusing
          # "unable to build chain to self-signed root" error.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/cert.p12"

          echo "Identities available to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # Xcode locates profiles by their embedded UUID, not by filename.
          UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -o - -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"

          NAME="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract Name raw -o - -)"
          echo "Installed profile '$NAME' as $UUID.mobileprovision"

          # The profile's own Name must match the secret the patcher writes
          # into PROVISIONING_PROFILE_SPECIFIER, or xcodebuild fails late with
          # "no profile matching". Comparing here fails early and says why.
          if [ "$NAME" != "${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}" ]; then
            echo "::error::Profile Name is '$NAME' but IOS_PROVISIONING_PROFILE_SPECIFIER is '${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}'. They must match exactly."
            exit 1
          fi

      # Same script as the compile gate. Signing turns on only because these
      # two variables are set; the gate runs it with them unset and gets an
      # unsigned tree. One source of truth for every generated-tree value.
      - name: Configure generated iOS project
        env:
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: python3 tool/configure_ios.py

      - name: Install dependencies
        run: flutter pub get

      # The icon and launch screen are generated from assets/ into the platform
      # tree, and `flutter create` above rebuilt that tree from scratch (ios/ is
      # gitignored, so the checkout has none). Without these, every CI build
      # ships Flutter's default blue icon and a blank white splash regardless of
      # what is committed under assets/. Must run after `flutter pub get` --
      # `dart run` needs the dev_dependencies resolved -- and before the build.
      # Both read their config from pubspec.yaml. Running after configure_ios.py
      # is safe: the splash tool does rewrite Info.plist (it sets
      # UIStatusBarHidden), but as a keyed edit -- verified locally that every
      # key configure_ios.py asserts is still intact afterwards.
      - name: Stamp app icon and launch screen
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          # Generated rather than committed: it carries the team id and the
          # profile name, and it must agree with the xcconfig the patcher
          # wrote. Both read the same two secrets so they cannot drift.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>io.github.floresgl1.golfSwingAnalyzer</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      # TestFlight permanently rejects a build number it has already seen, so
      # it comes from the run number rather than from a committed bump.
      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        if: ${{ !inputs.skip_upload }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool discovers the key by name in this directory; there is no
          # flag to pass the key material inline.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Three forms of this secret occur in practice and altool accepts
          # only the first. All three are normalised to PEM here, because each
          # rejected form otherwise costs a full runner round trip to identify.
          #
          #   1. raw PEM          -- the .p8 file's text, armor included
          #   2. base64 of (1)    -- what `base64 -w0 AuthKey_*.p8` produces
          #   3. base64 body only -- the .p8 with its -----BEGIN/END----- lines
          #                          stripped, which decodes to bare DER
          #
          # Form 3 is the trap: it looks exactly like form 2 to any check that
          # only asks "is this base64?", and decoding it yields ~150 bytes of
          # valid DER with no PEM armor. altool reported that as "The file
          # couldn't be opened because it isn't in the correct format. (259)",
          # naming neither the file nor the reason.
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q -- '-----BEGIN'; then
            echo "Key secret is raw PEM; writing it through unchanged."
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/key.decoded"
            if head -c 11 "$RUNNER_TEMP/key.decoded" | grep -q -- '-----BEGIN'; then
              echo "Key secret is base64-encoded PEM; decoded."
              cp "$RUNNER_TEMP/key.decoded" "$KEY_PATH"
            else
              echo "Key secret decoded to bare DER (no PEM armor); re-armoring."
              {
                echo "-----BEGIN PRIVATE KEY-----"
                base64 -w 64 < "$RUNNER_TEMP/key.decoded" 2>/dev/null \
                  || base64 -b 64 < "$RUNNER_TEMP/key.decoded"
                echo "-----END PRIVATE KEY-----"
              } > "$KEY_PATH"
            fi
            rm -f "$RUNNER_TEMP/key.decoded"
          fi

          # Parse the key rather than just eyeballing its header. A PEM header
          # proves shape, not usability; `openssl pkey` proves altool will be
          # able to sign with it. Nothing here prints key material — failures
          # report the byte count only.
          if ! openssl pkey -in "$KEY_PATH" -noout > /dev/null 2>&1; then
            echo "::error::$KEY_PATH is not a usable private key ($(wc -c < "$KEY_PATH" | tr -d ' ') bytes). APP_STORE_CONNECT_PRIVATE_KEY must hold the AuthKey_*.p8 contents: raw, base64-encoded, or the base64 body alone."
            exit 1
          fi
          echo "API key OK ($(wc -c < "$KEY_PATH" | tr -d ' ') bytes, parsed by openssl)."

          IPA="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa produced under build/ios/ipa"
            exit 1
          fi

          # An IPA is a zip. Testing it here separates "the archive is corrupt"
          # from "the key is corrupt" — altool reports both with the same
          # message, which is what made the first failure ambiguous.
          if ! unzip -qt "$IPA" > /dev/null 2>&1; then
            echo "::error::$IPA is not a readable zip archive."
            exit 1
          fi
          echo "Uploading $IPA ($(du -h "$IPA" | cut -f1), zip integrity OK)"

          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: flutter_app/build/ios/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 7

      # always(): a failed run must not leave the certificate in a keychain on
      # a runner image, and must not leave the search list pointing at one.
      - name: Clean up keychain and key material
        if: always()
        run: |
          security list-keychains -d user -s $(security list-keychains -d user | grep -v signing.keychain | tr -d '"') || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" || true
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/cert.p12" || true
