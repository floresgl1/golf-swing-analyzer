name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: flutter_app

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      # Platform folders are gitignored in this repo and regenerated on
      # demand, so the runner's checkout has no ios/ directory at all.
      # --project-name is explicit because the directory (flutter_app) does
      # not match the pubspec name (golf_swing_analyzer).
      #
      # android is generated too, and NOT because this job builds it. The icon
      # step below fails outright without it: flutter_launcher_icons decides
      # what to write from the config alone (`android: true` in pubspec.yaml)
      # and never checks whether android/ exists, so on an ios-only tree it
      # part-writes the Android resources and then dies on the missing
      # AndroidManifest.xml, exit 2. Generating the throwaway tree costs a
      # couple of seconds and keeps pubspec.yaml the single source of icon
      # config; the alternative is a second ios-only config file that would
      # drift. Do not trim this back to --platforms=ios.
      - name: Generate iOS platform files
        run: flutter create --platforms=ios,android --project-name golf_swing_analyzer .

      # Must run after `flutter create` (there is no ios/ before it) and before
      # `pod install`, which the build step triggers. The script owns the
      # deployment target and the camera usage description, and refuses to exit
      # 0 unless it has re-read each file and confirmed the value landed.
      - name: Configure generated iOS project
        run: python3 tool/configure_ios.py

      - name: Install dependencies
        run: flutter pub get

      # The icon and launch screen are generated from assets/ into the platform
      # tree, and `flutter create` above rebuilt that tree from scratch (ios/ is
      # gitignored, so the checkout has none). Without these, every CI build
      # ships Flutter's default blue icon and a blank white splash regardless of
      # what is committed under assets/. Must run after `flutter pub get` --
      # `dart run` needs the dev_dependencies resolved -- and before the build.
      # Both read their config from pubspec.yaml. Running after configure_ios.py
      # is safe: the splash tool does rewrite Info.plist (it sets
      # UIStatusBarHidden), but as a keyed edit -- verified locally that every
      # key configure_ios.py asserts is still intact afterwards. The two tools
      # differ on missing platform folders: flutter_native_splash guards every
      # platform with a Directory().existsSync() check and quietly skips (which
      # is why the web half of its config is a no-op here), flutter_launcher_icons
      # does not guard at all -- hence the android tree created above.
      - name: Stamp app icon and launch screen
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign
