name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: flutter_app

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      # Platform folders are gitignored in this repo and regenerated on
      # demand, so the runner's checkout has no ios/ directory at all.
      # --project-name is explicit because the directory (flutter_app) does
      # not match the pubspec name (golf_swing_analyzer).
      - name: Generate iOS platform files
        run: flutter create --platforms=ios --project-name golf_swing_analyzer .

      # ML Kit (google_mlkit_commons) requires iOS 15.5; the generated project
      # targets 13.0. Patched here rather than committed because ios/ is
      # regenerated on every run. Keep in sync with flutter_app/README.md.
      - name: Set iOS deployment target
        run: |
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" ios/Runner.xcodeproj/project.pbxproj
          # A silently no-opping sed would resurface as a confusing pod install
          # failure, so fail here instead if the SDK template ever changes.
          grep -q "^platform :ios, '15.5'" ios/Podfile \
            || { echo "::error::Podfile platform patch did not apply"; exit 1; }
          grep -q "IPHONEOS_DEPLOYMENT_TARGET = 15.5;" ios/Runner.xcodeproj/project.pbxproj \
            || { echo "::error::pbxproj deployment target patch did not apply"; exit 1; }

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign
