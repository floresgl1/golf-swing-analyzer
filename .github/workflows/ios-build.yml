name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: flutter_app

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      # Platform folders are gitignored in this repo and regenerated on
      # demand, so the runner's checkout has no ios/ directory at all.
      # --project-name is explicit because the directory (flutter_app) does
      # not match the pubspec name (golf_swing_analyzer).
      - name: Generate iOS platform files
        run: flutter create --platforms=ios --project-name golf_swing_analyzer .

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign
